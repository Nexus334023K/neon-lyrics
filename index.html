<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeonLyrics Overlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-cyber">
  <div class="lyrics-root" id="lyrics-root">
    <canvas id="scene-3d-canvas" class="scene-3d-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;"></canvas>
    <div class="lyrics-container" id="lyrics-container">


      
      <!-- Stage with 3-line support -->
      <div class="stage" id="stage">
        <div class="line past-line" id="past-line"></div>
        <div class="line active-line" id="active-line"></div>
        <div class="line next-line" id="next-line"></div>
      </div>

      <!-- Glassmorphic Mini Player Bar -->
      <div class="mini-player" id="mini-player">
        <button class="player-toggle-btn no-drag" id="player-toggle-btn" title="Hide/Show Mini Player">
          <svg class="toggle-icon-down" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
          <svg class="toggle-icon-up" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>

        <div class="mini-player-body" id="mini-player-body">
          <div class="player-left">
            <div class="album-art-wrap" id="album-art-wrap">
              <img id="player-art" class="player-art" src="" alt="Album Art" style="display:none;" />
              <div class="player-art-placeholder" id="player-art-placeholder">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3" fill="#0b0f19"></circle></svg>
              </div>
            </div>
            <div class="track-details">
              <span class="player-title" id="player-title">Waiting for music...</span>
              <span class="player-artist" id="player-artist">Spotify / Windows Media</span>
            </div>
          </div>

          <div class="player-center">
            <div class="controls-row no-drag">
              <button class="ctrl-btn" id="btn-prev" title="Previous Track">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="3"></line></svg>
              </button>
              <button class="ctrl-btn play-pause-btn" id="btn-play-pause" title="Play / Pause">
                <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg id="icon-pause" style="display:none;" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
              </button>
              <button class="ctrl-btn" id="btn-next" title="Next Track">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3"></line></svg>
              </button>
            </div>

            <div class="progress-wrap no-drag">
              <span class="time-label" id="time-current">0:00</span>
              <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
              </div>
              <span class="time-label" id="time-total">0:00</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Directional Motion Blur SVG Filter Defs -->
  <svg class="motion-blur-svg-defs" aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;">
    <defs>
      <filter id="directional-motion-blur" x="-20%" y="-40%" width="140%" height="180%">
        <feGaussianBlur id="motion-blur-filter" stdDeviation="0 0" />
      </filter>
    </defs>
  </svg>

  <script src="src/utils/paletteExtractor.js"></script>
  <script src="src/utils/motionEngine.js"></script>
  <script src="src/presets/glowPresets.js"></script>
  <script src="src/presets/typographyPresets.js"></script>
  <script src="src/plugins/PluginInterface.js"></script>
  <script src="src/plugins/PluginManager.js"></script>
  <script src="src/transitions/EasingLibrary.js"></script>
  <script src="src/transitions/effects/MorphTransition.js"></script>
  <script src="src/transitions/effects/SlideBlurTransition.js"></script>
  <script src="src/transitions/effects/ParticleDissolveTransition.js"></script>
  <script src="src/transitions/effects/ElasticTransition.js"></script>
  <script src="src/transitions/effects/LetterRevealTransition.js"></script>
  <script src="src/transitions/effects/FadeBlurTransition.js"></script>
  <script src="src/transitions/WordTransitionController.js"></script>
  <script src="src/modes/WallpaperMode.js"></script>
  <script src="src/transitions/LineTransitionController.js"></script>
  <script src="src/transitions/AdaptiveQualityController.js"></script>
  <script src="src/audio/AudioCaptureService.js"></script>
  <script src="src/audio/AudioAnalysisEngine.js"></script>
  <script src="src/audio/AudioReactiveDispatcher.js"></script>
  <script src="src/three/ParticleEnvironment.js"></script>
  <script src="src/three/Scene3DManager.js"></script>
  <script src="src/ai/LocalHeuristicsProvider.js"></script>
  <script src="src/ai/AIIntelligenceService.js"></script>
  <script src="src/lyrics/RomanizationHelper.js"></script>
  <script src="src/lyrics/LyricsStudioManager.js"></script>
  <script src="src/desktop/SnapGeometry.js"></script>
  <script src="src/desktop/DesktopWindowManager.js"></script>
  <script src="src/insights/InsightsStorage.js"></script>
  <script src="src/insights/MetricsAggregator.js"></script>
  <script src="src/presets/masterPresets.js"></script>
  <script src="src/presets/UniversalPresetManager.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
